name: Sincronizzazione Giornaliera Scacchi

on:
  schedule:
    - cron: '0 3 * * *' # Esegue ogni giorno alle 03:00 UTC
  workflow_dispatch: # Permette di avviarlo manualmente anche dalla tab Actions di GitHub

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests chess supabase

      - name: Esecuzione Worker di Sincronizzazione
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python sync_worker.py
