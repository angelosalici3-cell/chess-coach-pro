name: nightly-sync
# Ora solo a mano (il download notturno è dentro nightly-analysis). Utile per forzare un download senza analisi.
on:
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "${{ secrets.API_URL }}/cron/sync" -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" --max-time 120
