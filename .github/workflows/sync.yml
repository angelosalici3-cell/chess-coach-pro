name: nightly-sync

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up backend
        run: |
          curl -sS --max-time 90 "${{ secrets.API_URL }}/health" || true
      - name: Start sync
        run: |
          curl -fsS -X POST "${{ secrets.API_URL }}/cron/sync" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 120
