name: nightly-analysis
# Fase 2: parte mezz'ora dopo il download (sync.yml, 02:00 UTC) e analizza tutte le partite in attesa.
on:
  schedule: [{ cron: "30 2 * * *" }]
  workflow_dispatch:
concurrency: nightly-analysis
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: "Installa Stockfish (motore locale, senza limiti di richieste)"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq stockfish
          echo uci | /usr/games/stockfish | head -2
      - name: Analizza le partite in attesa
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANALYZE_BUDGET_MIN: "300"
          STOCKFISH_PATH: /usr/games/stockfish
          LOCAL_DEPTH: "16"      # profondità per posizione (il servizio esterno usava 12)
          LOCAL_TIME: "4"        # tetto di secondi per posizione
        run: python -m scripts.analyze_worker
