name: pattern-probe
# Sonda degli schemi di errore: si lancia a mano da GitHub (Actions → pattern-probe → Run workflow), scrive il risultato nel log.
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email dell'account da analizzare"
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Sonda
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROBE_EMAIL: ${{ github.event.inputs.email }}
        run: python -m scripts.pattern_probe --email "$PROBE_EMAIL"
